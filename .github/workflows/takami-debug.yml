name: Takami debug APK

on:
  push:
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "i18n/src/**"
      - ".github/workflows/takami-debug.yml"
      - "telemetry-collector/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Unit tests (сетевой слой Takami)
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests "eu.kanade.tachiyomi.takami.*"
          --console=plain

      - name: Адрес приёмника задан
        run: |
          if [ -n "$REPORT_ENDPOINT" ]; then
            echo "адрес приёмника задан: да"
          else
            echo "адрес приёмника задан: нет"
          fi
        env:
          REPORT_ENDPOINT: ${{ secrets.TELEMETRY_URL }}

      - name: Подпись приёмника задана
        run: |
          if [ -n "$SIGNATURE" ]; then
            echo "подпись задана: да"
          else
            echo "подпись задана: нет"
          fi
        env:
          SIGNATURE: ${{ secrets.TELEMETRY_TOKEN }}

      - name: Build debug (x86_64)
        run: ./gradlew :app:assembleDebug -Ptakami.abi=x86_64 --console=plain
        env:
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}

      - name: Проверить, что APK ровно один
        run: |
          count=$(ls app/build/outputs/apk/debug/*.apk | wc -l)
          echo "Собрано APK: $count"
          test "$count" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: takami-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
