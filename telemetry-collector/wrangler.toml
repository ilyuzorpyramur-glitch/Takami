# Приёмник отчётов: Cloudflare Worker, без своего сервера.
name = "takami-reports"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Имя namespace создаёт владелец и подставляет сюда id.
[[kv_namespaces]]
binding = "REPORTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Сколько дней храним записи. 90 по умолчанию.
RETENTION_DAYS = "90"

[triggers]
# Раз в сутки чистим то, что не удалилось по сроку жизни ключа.
crons = ["15 3 * * *"]
